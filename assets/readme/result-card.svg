<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" role="img" aria-label="Results: the pre-registered test failed (1.04 times the size rule, 2 times required); beyond size the graph adds 0.09 to 0.23 AUC (exploratory); agents reading the graph through Relate picked 9 of 30 pairs that came true, where chance expects 1.5 and the graph alone got 10."><rect x="1" y="1" width="1198" height="228" rx="10" fill="#EEF1EC" stroke="#C9D0C8"/><text x="40" y="58" font-size="18" font-weight="600" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">PRE-REGISTERED TEST</text><text x="40" y="118" font-size="50" fill="#16211C" font-family="Georgia, 'Times New Roman', serif">Failed</text><text x="40" y="160" font-size="20" fill="#16211C" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1.04x the size rule, 2x required</text><text x="40" y="188" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">on the top 100 pairs, 2005 to 2014</text><line x1="410" y1="40" x2="410" y2="200" stroke="#C9D0C8"/><text x="440" y="58" font-size="18" font-weight="600" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">BEYOND SIZE (EXPLORATORY)</text><text x="440" y="118" font-size="50" fill="#16211C" font-family="Georgia, 'Times New Roman', serif">+0.09 to +0.23</text><text x="440" y="160" font-size="20" fill="#16211C" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">AUC over the size rule</text><text x="440" y="188" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">on pairs it ranks low; defined afterwards</text><line x1="810" y1="40" x2="810" y2="200" stroke="#C9D0C8"/><text x="840" y="58" font-size="18" font-weight="600" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">AGENTS THROUGH RELATE</text><text x="840" y="118" font-size="50" fill="#16211C" font-family="Georgia, 'Times New Roman', serif">9 of 30</text><text x="840" y="160" font-size="20" fill="#16211C" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">came true; chance expects 1.5</text><text x="840" y="188" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">the graph alone: 10 of 30</text></svg>