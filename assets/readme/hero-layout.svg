<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Prometheus: a graph of technology fields that predicts which will combine next"><rect width="1200" height="520" fill="#EEF1EC"/><text x="64" y="138" font-size="88" font-weight="600" fill="#16211C" font-family="Newsreader, Georgia, 'Times New Roman', serif">Prometheus</text><text x="66" y="194" font-size="28" fill="#16211C" font-family="Newsreader, Georgia, 'Times New Roman', serif">Which technology fields will combine next?</text><text x="66" y="238" font-size="20" fill="#4B5750" font-family="Instrument Sans, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A graph of 123 fields from 9.45 million US patents,</text><text x="66" y="266" font-size="20" fill="#4B5750" font-family="Instrument Sans, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">kept in one Relate file, that grades its own</text><text x="66" y="294" font-size="20" fill="#4B5750" font-family="Instrument Sans, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">predictions against history.</text><line x1="66" y1="330" x2="560" y2="330" stroke="#C9D0C8"/><line x1="66" y1="364" x2="104" y2="364" stroke="#BF3A16" stroke-width="3.6" stroke-dasharray="11 7"/><text x="116" y="371" font-size="20" fill="#16211C" font-family="Instrument Sans, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The graph's #1 pick in 2005: <tspan font-weight="600">G05D × G06K</tspan></text><text x="116" y="399" font-size="18" fill="#4B5750" font-family="Instrument Sans, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">control systems × reading and recognising data</text><text x="66" y="440" font-size="20" font-weight="600" fill="#16211C" font-family="Instrument Sans, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">They combined 6 years later, in 2011.</text><text x="66" y="484" font-size="18" fill="#4B5750" font-fa