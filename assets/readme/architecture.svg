<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="100%" role="img" aria-label="Architecture: PatentsView tables are reduced by DuckDB to small CSVs and built into one Relate file. Web views, the predictor and your own agent query it; sealed per-year capsules serve forecaster agents over read-only MCP; agents write forecasts into a shared ledger file in one transaction each and a grader writes the outcomes back."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5750"/></marker></defs><rect x="1" y="1" width="1198" height="528" rx="10" fill="#EEF1EC" stroke="#C9D0C8"/><g transform="translate(0,20)"><rect x="20" y="40" width="230" height="80" rx="8" fill="#EEF1EC" stroke="#C9D0C8" stroke-width="1.5"/><text x="36" y="74" font-size="20" font-weight="600" fill="#16211C" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">PatentsView</text><text x="36" y="102" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">9.45M patents, 4 tables</text><line x1="250" y1="80" x2="330" y2="80" stroke="#4B5750" stroke-width="2"  marker-end="url(#ah)"/><text x="290" y="72" text-anchor="middle" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">DuckDB</text><rect x="330" y="40" width="210" height="80" rx="8" fill="#EEF1EC" stroke="#C9D0C8" stroke-width="1.5"/><text x="346" y="74" font-size="20" font-weight="600" fill="#16211C" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Small CSVs</text><text x="346" y="102" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">fields, pairs, links</text><line x1="540" y1="80" x2="620" y2="80" stroke="#4B5750" stroke-width="2"  marker-end="url(#ah)"/><text x="580" y="72" text-anchor="middle" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">build</text><rect x="620" y="30" width="300" height="100" rx="18" fill="#E5E9E2" stroke="#16211C" stroke-width="2"/><text x="636" y="64" font-size="20" font-weight="600" fill="#16211C" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">data/prometheus.rl</text><text x="636" y="92" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">the graph, one Relate file</text><rect x="620" y="250" width="300" height="100" rx="18" fill="#E5E9E2" stroke="#16211C" stroke-width="2"/><text x="636" y="284" font-size="20" font-weight="600" fill="#16211C" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">capsules/YYYY.rl</text><text x="636" y="312" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">sealed, blinded, per year</text><line x1="435" y1="120" x2="620" y2="290" stroke="#4B5750" stroke-width="2"  marker-end="url(#ah)"/><text x="512" y="228" text-anchor="end" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">capsule</text><rect x="990" y="0" width="200" height="70" rx="8" fill="#EEF1EC" stroke="#C9D0C8" stroke-width="1.5"/><text x="1006" y="34" font-size="20" font-weight="600" fill="#16211C" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Web views</text><text x="1006" y="62" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Cypher, live</text><rect x="990" y="90" width="200" height="70" rx="8" fill="#EEF1EC" stroke="#C9D0C8" stroke-width="1.5"/><text x="1006" y="124" font-size="20" font-weight="600" fill="#16211C" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Predictor</text><text x="1006" y="152" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">backtest, scoring</text><rect x="990" y="180" width="200" height="70" rx="8" fill="#EEF1EC" stroke="#C9D0C8" stroke-width="1.5"/><text x="1006" y="214" font-size="20" font-weight="600" fill="#16211C" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Your agent</text><text x="1006" y="242" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">read-only MCP</text><line x1="920" y1="50" x2="990" y2="36" stroke="#4B5750" stroke-width="2"  marker-end="url(#ah)"/><line x1="920" y1="80" x2="990" y2="125" stroke="#4B5750" stroke-width="2"  marker-end="url(#ah)"/><line x1="920" y1="110" x2="990" y2="210" stroke="#4B5750" stroke-width="2"  marker-end="url(#ah)"/><rect x="990" y="280" width="200" height="70" rx="8" fill="#EEF1EC" stroke="#C9D0C8" stroke-width="1.5"/><text x="1006" y="314" font-size="20" font-weight="600" fill="#16211C" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Forecasters</text><text x="1006" y="342" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">read-only MCP</text><line x1="920" y1="300" x2="990" y2="315" stroke="#4B5750" stroke-width="2"  marker-end="url(#ah)"/><rect x="620" y="400" width="300" height="90" rx="18" fill="#E5E9E2" stroke="#16211C" stroke-width="2"/><text x="636" y="434" font-size="20" font-weight="600" fill="#16211C" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">results/ledger/ledger.rl</text><text x="636" y="462" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">shared: agents write in</text><line x1="1090" y1="350" x2="920" y2="440" stroke="#4B5750" stroke-width="2"  marker-end="url(#ah)"/><text x="1190" y="484" text-anchor="end" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">one transaction per forecast</text><rect x="330" y="410" width="210" height="70" rx="8" fill="#EEF1EC" stroke="#C9D0C8" stroke-width="1.5"/><text x="346" y="444" font-size="20" font-weight="600" fill="#16211C" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Grader</text><text x="346" y="472" font-size="18" fill="#4B5750" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">writes outcomes back</text><line x1="540" y1="445" x2="620" y2="445" stroke="#4B5750" stroke-width="2"  marker-end="url(#ah)"/></g></svg>